<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <!-- One social post, 1080 × 1350 (4:5, the tallest a Facebook or Instagram feed shows whole):
         a picture from the showcase over the prompt that made it. build.mjs fills it from posts.json. -->
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1080px;
        height: 1350px;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: "Inter Display", Inter, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
      }
      #picture {
        height: 800px;
        position: relative;
        overflow: hidden;
      }
      #picture img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      #picture::after {
        content: "";
        position: absolute;
        inset: auto 0 0 0;
        height: 220px;
        background: linear-gradient(transparent, #0a0a0a);
      }
      #title {
        position: absolute;
        left: 56px;
        right: 56px;
        bottom: 26px;
        z-index: 1;
        font-size: 60px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.08;
      }
      #body {
        flex: 1;
        padding: 26px 56px 0;
        display: flex;
        flex-direction: column;
      }
      #kicker {
        font-size: 30px;
        font-weight: 700;
        color: #ffd60a;
        letter-spacing: 0.02em;
      }
      #prompt {
        margin-top: 16px;
        font-size: 35px;
        line-height: 1.36;
        color: #d4d4d4;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 6;
        overflow: hidden;
      }
      #foot {
        margin-top: auto;
        height: 124px;
        display: flex;
        align-items: center;
        gap: 18px;
        border-top: 1px solid rgb(255 255 255 / 0.1);
        font-size: 32px;
        font-weight: 600;
      }
      #foot img {
        width: 60px;
        height: 60px;
        border-radius: 15px;
      }
      #model {
        color: #a3a3a3;
        font-weight: 500;
      }
      #url {
        margin-left: auto;
        color: #ffd60a;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="picture"><img id="image" alt="" /><div id="title"></div></div>
    <div id="body">
      <div id="kicker">CÂU LỆNH ĐÃ TẠO RA ẢNH NÀY</div>
      <div id="prompt"></div>
      <div id="foot">
        <img src="../../packages/web/public/logo.svg" alt="" />
        <span>Amberpix</span>
        <span id="model"></span>
        <span id="url">amberpix.com</span>
      </div>
    </div>
    <script>
      window.fill = (post) => {
        document.getElementById("image").src = post.image
        document.getElementById("title").textContent = post.title
        document.getElementById("prompt").textContent = `“${post.prompt}”`
        document.getElementById("model").textContent = `· ${post.model}`
        return document.getElementById("image").decode()
      }
    </script>
  </body>
</html>
