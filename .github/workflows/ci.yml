name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun typecheck

  # oxlint exits nonzero on errors only, so this enforces a clean error count while the existing
  # warnings ride along; they come down on their own schedule rather than blocking every PR.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: core
        run: bun test --only-failures
        working-directory: packages/core
      # The kiwii suite spawns `bun src/index.ts run ...` subprocesses concurrently; warm the
      # runtime transpiler cache once so cold starts on small runners stay within the harness timeouts.
      - name: warm kiwii transpiler cache
        run: bun src/index.ts --version && bun src/index.ts run --help > /dev/null
        working-directory: packages/kiwii
        env:
          KIWII_DISABLE_AUTOUPDATE: "1"
          KIWII_DISABLE_MODELS_FETCH: "1"
      # Concurrent subprocess tests each boot the CLI; cap concurrency so small runners stay within timeouts.
      - name: kiwii
        run: bun test --timeout 30000 --only-failures --max-concurrency 3
        working-directory: packages/kiwii
        env:
          CI: "true"
      - name: tui
        run: bun test --timeout 30000 --only-failures
        working-directory: packages/tui
      - name: ui
        run: bun test src --only-failures
        working-directory: packages/ui
      - name: session-ui
        run: bun test src --only-failures
        working-directory: packages/session-ui
      - name: app
        run: bun run test:unit && bun run test:browser
        working-directory: packages/app
      - name: llm
        run: bun test --timeout 30000 --only-failures
        working-directory: packages/llm
      - name: api
        run: bun test --only-failures
        working-directory: packages/api
      - name: codemode
        run: bun test --only-failures
        working-directory: packages/codemode
      - name: schema
        run: bun test --only-failures
        working-directory: packages/schema
      - name: protocol
        run: bun test --only-failures
        working-directory: packages/protocol

  # Two Windows bugs shipped in a row because nothing ran there: PowerShell wrote non-ASCII output as
  # "?", and the installer looked for a binary without the .exe suffix. This job covers both shapes.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: core
        run: bun test --timeout 30000 --only-failures
        working-directory: packages/core
      # install.ps1 pulls the published release, so this checks the installer itself rather than the
      # code under review: the file it writes has to be the kiwii.exe that Windows PATH resolves.
      - name: install.ps1
        shell: pwsh
        env:
          KIWII_NO_MODIFY_PATH: "1"
        run: |
          ./install.ps1
          $exe = Join-Path $env:USERPROFILE ".kiwii\bin\kiwii.exe"
          if (-not (Test-Path $exe)) { throw "installer did not write $exe" }
          & $exe --version
