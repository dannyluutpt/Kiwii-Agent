name: deploy-app

# Deploys the Kiwii web app Worker (packages/api + packages/web) on every push to main that
# touches it. Needs the CLOUDFLARE_API_TOKEN repository secret (Workers Scripts, D1 and
# Workers R2 edit permissions on the account).

on:
  push:
    branches: [main]
    paths:
      - "packages/api/**"
      - "packages/web/**"
      - "packages/ui/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: packages/web
      - run: bunx wrangler d1 migrations apply kiwii --remote
        working-directory: packages/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: bunx wrangler deploy
        working-directory: packages/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
